[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chalkmate-backend"
version = "0.0.0"
description = "Shared API and worker foundation for Chalkmate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1,<2",
  "psycopg[binary]>=3,<4",
  "celery[redis]>=5,<6",
  "httpx>=0.28,<1",
  "email-validator>=2,<3",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "pypdfium2>=4,<6",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["chalkmate"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
